name: Deploy SaaS relay

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Viewer tests
        if: hashFiles('web/package.json') != ''
        run: npm --prefix web ci && npm --prefix web test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The new viewer (web/) is built here on the runner; only web/dist is
      # shipped to the server.
      - name: Build viewer
        if: hashFiles('web/package.json') != ''
        run: npm --prefix web ci && npm --prefix web run build

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Push the runner's checkout to the server instead of pulling from GitHub
      # on the server — the server never needs a GitHub credential.
      - name: Rsync to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR:  ${{ secrets.APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude=.git --exclude=node_modules --exclude=logs --exclude=.env --exclude=data \
            --exclude=web/node_modules --exclude=web/src --exclude=web/fixtures --exclude=test \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Install deps and reload pm2
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR:  ${{ secrets.APP_DIR }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -lc "'
            set -euo pipefail
            cd \"$APP_DIR\"
            npm ci --omit=dev
            mkdir -p logs
            if pm2 describe logviewer >/dev/null 2>&1; then
              pm2 reload logviewer --update-env
            else
              pm2 start ecosystem.config.js --env production
              pm2 save
            fi
            pm2 describe logviewer | sed -n 1,40p
          '"
